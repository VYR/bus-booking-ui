<div class="flex flex-col w-full ">
<div class="flex flex-row gap-3 w-full overflow-x-auto ">
    @for (item of menuBar; track $index) {
        <div 
            class="h-menu-item"
             *appHasEntitlement="item?.uuid"
            [routerLink]="[item?.path]" 
            routerLinkActive="dashboard-router-active-bg" 
            [routerLinkActiveOptions]="{ exact: false}" 
        >{{item?.name}}</div>
    }
</div>
</div>
